services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sss-auto-spares:latest
    container_name: sss-auto-spares
    ports:
      # Host port 3050 keeps 3000 free for the other local projects.
      - "3050:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: unless-stopped